<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 10 - Formulario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg border-success">
                    <div class="card-header bg-success text-white">
                        <h2 class="h4 mb-0 text-center">Cálculo de Operaciones (Separado)</h2>
                    </div>
                    
                    <form action="procesar_calculo.php" method="POST"> 
                        <div class="card-body">
                            
                            <div class="mb-3">
                                <label for="num1" class="form-label">Número 1:</label>
                                <input type="number" step="any" class="form-control" id="num1" name="num1" required>
                            </div>

                            <div class="mb-3">
                                <label for="num2" class="form-label">Número 2:</label>
                                <input type="number" step="any" class="form-control" id="num2" name="num2" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="operacion" class="form-label">Operación:</label>
                                <select class="form-select" id="operacion" name="operacion" required>
                                    <option value="" selected disabled>Selecciona una operación</option>
                                    <option value="sumar">Suma (+)</option>
                                    <option value="restar">Resta (-)</option>
                                    <option value="multiplicar">Multiplicación (*)</option>
                                    <option value="dividir">División (/)</option>
                                </select>
                            </div>
                            
                            <button type="submit" class="btn btn-success w-100 mt-3">Calcular y Mostrar Resultado</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
